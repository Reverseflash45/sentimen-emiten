# Pengumpulan data otomatis — pengganti Task Scheduler di laptop.
#
# RSS hanya menyimpan puluhan artikel terakhir, jadi berita yang tidak
# terkumpul hari ini hilang selamanya. Menjalankannya di GitHub berarti deret
# waktu tetap tumbuh walau laptop mati.
#
# Rahasia yang wajib diisi (Settings → Secrets and variables → Actions):
#   DATABASE_URL  URL PostgreSQL Supabase (session pooler, port 5432)
#   USER_AGENT    identitas crawler yang bisa dihubungi, mis. "SentimenEmitenBot/0.1 (email@contoh.com)"

name: Siklus harian

on:
  schedule:
    # berita tiap 4 jam: 07.30, 11.30, 15.30, 19.30, 23.30, 03.30 WIB.
    # Dua kali sehari tidak cukup — RSS portal yang ramai sudah menggeser
    # berita pagi sebelum sore tiba, dan berita yang terlewat hilang permanen.
    # Jadwal GitHub sering molor beberapa jam; jarak 4 jam memberi cadangan.
    - cron: "30 0,4,8,12,16,20 * * *"
    - cron: "0 11 * * 1-5"  # 18.00 WIB, hari bursa — harga penutupan
  workflow_dispatch:
    inputs:
      harga:
        description: "Perbarui harga juga"
        type: boolean
        default: true

concurrency:
  group: siklus-harian
  cancel-in-progress: false

permissions:
  contents: write   # menyimpan CSV harga baru kembali ke repo

jobs:
  berita:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != '0 11 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      USER_AGENT: ${{ secrets.USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Kumpulkan, petakan, dan labeli berita
        run: python -m scripts.siklus_harian --log ""

  harga:
    if: (github.event_name == 'workflow_dispatch' && inputs.harga) || github.event.schedule == '0 11 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt yfinance
      - name: Unduh harga ke CSV lalu impor ke basis data
        run: |
          # unduh_harga menulis ulang CSV per emiten untuk rentang yang diminta,
          # jadi rentangnya selalu dari awal periode penelitian sampai besok
          # (batas akhir yfinance bersifat eksklusif).
          SAMPAI=$(date -u -d tomorrow +%F)
          python -m scripts.unduh_harga 2026-01-01 "$SAMPAI"
          python -m scripts.impor_harga data/harga 2026-01-01 "$SAMPAI"
      - name: Simpan CSV harga ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/harga
          if git diff --cached --quiet; then
            echo "Tidak ada harga baru."
          else
            git commit -m "Perbarui data harga $(date -u +%F)"
            git push
          fi
